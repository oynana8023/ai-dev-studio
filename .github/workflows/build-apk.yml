name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # 🌟 关键步骤：让云端自动补全缺失的 Android 工程文件！
      - run: flutter create --platforms=android --org com.aidevstudio --project-name ai_dev_studio .
      
      - run: flutter pub get
      - run: flutter analyze || true
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ai-dev-studio-apk
          path: build/app/outputs/flutter-apk/app-release.apk