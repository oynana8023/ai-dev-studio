name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # 1. 云端自动生成缺失的 Android 工程文件
      - name: Create Android project files
        run: flutter create --platforms=android --org com.aidevstudio --project-name ai_dev_studio .

      # 2. 云端自动升级 Kotlin 版本，解决依赖插件报错
      - name: Upgrade Kotlin version
        run: sed -i 's/1.8.22/2.0.10/g' android/settings.gradle

      # 3. 拉取依赖并打包
      - run: flutter pub get
      - run: flutter analyze || true
      - run: flutter build apk --release

      # 4. 上传产物
      - uses: actions/upload-artifact@v4
        with:
          name: ai-dev-studio-apk
          path: build/app/outputs/flutter-apk/app-release.apk