name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # 1. 云端自动生成 Android 工程文件
      - name: Create Android project files
        run: flutter create --platforms=android --org com.aidevstudio --project-name ai_dev_studio .

      # 2. 强制升级 Kotlin 版本解决编译报错
      - name: Force upgrade Kotlin version
        run: |
          sed -i '/id "org.jetbrains.kotlin.android"/c\        id "org.jetbrains.kotlin.android" version "1.9.24" apply false' android/settings.gradle

      # 3. 强制注入网络权限（解决 Failed host lookup 问题）
      - name: Inject Internet Permission
        run: |
          sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          echo "===== 注入后的 AndroidManifest.xml ====="
          cat android/app/src/main/AndroidManifest.xml

      # 4. 拉取依赖并打包
      - run: flutter pub get
      - run: flutter analyze || true
      - run: flutter build apk --release

      # 5. 上传产物
      - uses: actions/upload-artifact@v4
        with:
          name: ai-dev-studio-apk
          path: build/app/outputs/flutter-apk/app-release.apk